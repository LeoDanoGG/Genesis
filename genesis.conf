# Genesis configuration
#
# Used in two ways:
#   - `genesis fast` / `genesis default`: no questions, these values are applied.
#   - `genesis` (wizard): these values are the default answer of every prompt,
#     so pressing Enter applies them (the hint becomes [Y/n] or [y/N]).
#
# This file is READ, never executed. Only the keys below are accepted, one
# KEY=VALUE per line: no quotes, no variables, no commands. Anything else is
# ignored with a warning.

# Author login(s) credited in README.md (and main.py).
# Empty = your current login ($USER). Group example: login1, login2
AUTHOR=

# Language: c | python
LANGUAGE=c

# C only. What the Makefile builds:
#   program = executable
#   library = static library (.a) built with ar
PROJECT_TYPE=program

# Yes/no questions: y | n   (C only, except GENERATE_README)
GENERATE_HEADER=y
GENERATE_MAKEFILE=y
USE_LIBFT=n

# y | n
GENERATE_README=y
